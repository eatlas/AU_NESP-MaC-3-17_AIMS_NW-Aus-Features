[general]
# Path to where to save downloaded third party data. To move the data out of the
# standard location use a symbolic link, or change this path. This variable
# is used by the scripts, but not QGIS.
#in_3p_path = data/v1-0/in-3p
#version = v1-0

in_3p_path = data/v1-1/in-3p
version = v1-1
previous_version = v1-0

[paths]
# Path to the data directory where the input and output data is stored. 
# This is used by scripts not QGIS.
data_path = data
# Edit shapefiles (A03 default comparison)
previous_edit = data/v1-0/in/Reef-Boundaries_v1-0_edit.shp
current_edit = data/v1-1/in/Reef-Boundaries_v1-1_edit.shp
# Processed output shapefiles — full L3 classes (A03 --processed, 11 output, 12 input, A01 input)
previous_processed = data/v1-0/out/full-classes/AU_NESP-MaC-3-17_AIMS_NW-Aus-Features_L3_v1-0.shp
current_processed = data/v1-1/out/full-classes/AU_NESP-MaC-3-17_AIMS_NW-Aus-Features_L3_v1-1.shp
# Simplified L2 classes (12 output)
current_processed_L2 = data/v1-1/out/simp-classes/AU_NESP-MaC-3-17_AIMS_NW-Aus-Features_L2_v1-1.shp
# Previous version L2 (used by 11-allocate-ReefIDs.py for spatial matching)
previous_processed_L2 = data/v1-0/out/simp-classes/AU_NESP-MaC-3-17_AIMS_NW-Aus-Features_L2_v1-0.shp